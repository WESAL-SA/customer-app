name: wesal_customer
description: Wesal customer (rider) app for the Saudi ride-hailing platform.
publish_to: "none"

# Version follows <marketing>+<build>. Keep build number monotonic for stores.
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # i18n
  intl: ^0.19.0

  # Networking (used by the REAL service implementations; mocks don't hit it)
  dio: ^5.5.0

  # Secure token storage (never store secrets in plain prefs)
  flutter_secure_storage: ^9.2.2

  # Local, non-sensitive cache (recent places, language, flags)
  shared_preferences: ^2.2.3

  # Value equality for models
  equatable: ^2.0.5

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Generates platform launcher icons from the brand mark.
  # Run after `flutter create .`:  dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.1

# App launcher icon configuration (assets/icon/ is produced by
# tool/generate_icon.py from the brand mark).
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/wesal_icon.png"
  background_color_ios: "#0F2D2B"
  min_sdk_android: 21
  adaptive_icon_background: "#0F2D2B"
  adaptive_icon_foreground: "assets/icon/wesal_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/wesal_icon.png"
    background_color: "#0F2D2B"
    theme_color: "#D7A93C"

flutter:
  uses-material-design: true
  generate: true # enables gen-l10n from l10n.yaml

  assets:
    - assets/images/
    - assets/icons/
    - assets/icon/

  # NOTE: Fonts (e.g. an Arabic-first family such as "IBM Plex Sans Arabic"
  # or "Cairo") should be added here once the font files are placed in
  # assets/fonts/. The design system (design_system/typography.dart) already
  # references a single family token so swapping is a one-line change.
  # fonts:
  #   - family: Wesal
  #     fonts:
  #       - asset: assets/fonts/Wesal-Regular.ttf
  #       - asset: assets/fonts/Wesal-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Wesal-Bold.ttf
  #         weight: 700
